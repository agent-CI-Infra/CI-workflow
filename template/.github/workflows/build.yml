# Compile and package the default branch; the build lane report feeds the dashboard.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Gate lane build
        run: node scripts/gate/gate.mjs run --lane build
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gates-build
          path: gate-reports/
          if-no-files-found: ignore